<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — recipe4you</title>
    <style>
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #FAFAF8;
        color: #1A1A1A;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 1.75rem; margin-bottom: 8px; }
      p { color: #5C5C5C; max-width: 400px; }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 24px;
        background: #E85D26;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
      }
      a:focus-visible { outline: 3px solid #E85D26; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>No internet connection. Previously viewed recipes are still available from the app.</p>
      <a href="/">Go to saved recipes</a>
    </main>
  </body>
</html>
